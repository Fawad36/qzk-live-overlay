services:
  - type: web
    name: qzk-live-overlay
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: QZK_ADMIN_PASSWORD
        sync: false
      - key: QZK_TOKEN_SECRET
        sync: false
