<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QZK Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6fb;color:#172033}.wrap{max-width:1050px;margin:30px auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 30px #18243a12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,button,select{width:100%;padding:11px;border:1px solid #d8deea;border-radius:10px;font:inherit}button{cursor:pointer;background:#2637d9;color:#fff;border:0;font-weight:700}.muted{color:#718096;font-size:13px}.row{display:flex;gap:8px;align-items:end}.row>*{flex:1}pre{white-space:pre-wrap;background:#101522;color:#dbe4ff;padding:12px;border-radius:10px;overflow:auto}.ok{color:#0b8f55}.err{color:#c6284d}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}.danger{background:#b42318}</style></head><body><div class="wrap">
<div class="card"><h1>QZK License & Session Admin</h1><p class="muted">Create licenses, bind A/B device HWIDs, and generate a browser overlay session.</p><div class="grid"><div><label>Admin password</label><input id="pw" type="password"></div><div><label>License days (0 = no expiry)</label><input id="days" type="number" value="0"></div><div><label>Optional license key</label><input id="key" placeholder="auto-generate"></div></div><br><button onclick="createLicense()">Create License</button><p id="msg"></p></div>
<div class="card"><h2>Register device</h2><div class="grid"><input id="rkey" placeholder="License key"><input id="hwid" placeholder="HWID"><input id="label" placeholder="Laptop A / Laptop B"><select id="role"><option>agent</option><option>viewer</option></select></div><br><button onclick="registerDevice()">Register / Bind HWID</button></div>
<div class="card"><h2>Create browser session</h2><div class="grid"><input id="skey" placeholder="License key"><input id="sname" value="Main Session" placeholder="Session name"><input id="sdays" type="number" value="0"></div><br><button onclick="createSession()">Generate Overlay Link</button><pre id="link">No session generated.</pre></div>
<div class="card"><h2>Licenses</h2><button onclick="loadAll()">Refresh</button><div id="licenses"></div></div>
</div><script>
const $=x=>document.getElementById(x), api='/api'; function pw(){return $('pw').value}
async function j(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d=await r.json().catch(()=>({detail:r.statusText}));if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function createLicense(){try{let d=await j(api+'/admin/licenses',{method:'POST',body:JSON.stringify({admin_password:pw(),days:+$('days').value,license_key:$('key').value})});$('rkey').value=d.license_key;$('skey').value=d.license_key;$('msg').className='ok';$('msg').textContent='Created: '+d.license_key;loadAll()}catch(e){$('msg').className='err';$('msg').textContent=e.message}}
async function registerDevice(){try{let d=await j(api+'/admin/devices',{method:'POST',body:JSON.stringify({admin_password:pw(),license_key:$('rkey').value,hwid:$('hwid').value,label:$('label').value,role:$('role').value})});$('msg').className='ok';$('msg').textContent='Bound device #'+d.id;loadAll()}catch(e){$('msg').className='err';$('msg').textContent=e.message}}
async function createSession(){try{let d=await j(api+'/admin/sessions',{method:'POST',body:JSON.stringify({admin_password:pw(),license_key:$('skey').value,name:$('sname').value,days:+$('sdays').value})});let control=location.origin+'/control?token='+encodeURIComponent(d.token);let display=location.origin+'/overlay?token='+encodeURIComponent(d.token);$('link').textContent='PRIMARY CONTROL LINK (paste this in browser):\n'+control+'\n\nDISPLAY LINK: '+display+'\n\nSESSION TOKEN: '+d.token}catch(e){$('link').textContent=e.message}}
async function loadAll(){try{let ls=await j(api+'/admin/licenses?password='+encodeURIComponent(pw()));$('licenses').innerHTML='<table><tr><th>Key</th><th>Status</th><th>Expiry</th></tr>'+ls.map(x=>`<tr><td>${x.license_key}</td><td>${x.status}</td><td>${x.expires_at||'never'}</td></tr>`).join('')+'</table>'}catch(e){$('licenses').innerHTML='<p class="err">'+e.message+'</p>'}}
</script></body></html>
