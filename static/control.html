<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QZK Overlay Control</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef2ff,#f7f8fc);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;padding:24px}.wrap{max-width:980px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.title{font-size:22px;font-weight:900}.sub{color:#718096;font-size:12px}.status{padding:7px 12px;border-radius:999px;background:#fee2e2;color:#b91c1c;font-size:12px;font-weight:800}.status.ok{background:#dcfce7;color:#15803d}.grid{display:grid;grid-template-columns:1.35fr .85fr;gap:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 10px 30px #1720330d;margin-bottom:16px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}label{font-size:11px;font-weight:800;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;display:block;margin:12px 0 6px}textarea,input,select,button{font:inherit}textarea,input,select{width:100%;padding:11px 12px;border:1px solid #d9dee8;border-radius:11px;outline:none}textarea{min-height:180px;resize:vertical}textarea:focus,input:focus,select:focus{border-color:#6574ea;box-shadow:0 0 0 3px #6574ea18}button{border:0;border-radius:11px;padding:11px 14px;background:#4f46e5;color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#eef2ff;color:#3730a3}button.danger{background:#fee2e2;color:#b91c1c}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{padding:10px;background:#f8fafc;border-radius:10px}.check input{width:auto}.range{display:grid;grid-template-columns:1fr 60px;gap:10px;align-items:center}.range input{padding:0}.pill{background:#f1f5f9;border-radius:9px;padding:8px;text-align:center;font-weight:800}.footer{font-size:11px;color:#718096}.toast{min-height:18px;font-size:12px;font-weight:700;margin-top:10px}.online{color:#15803d}.offline{color:#b91c1c}
</style></head><body><div class="wrap">
<div class="top"><div><div class="title">QZK Overlay Control</div><div class="sub" id="session">Connecting to session…</div></div><div id="status" class="status">OFFLINE</div></div>
<div class="grid"><div>
<div class="card"><label>Live Message</label><textarea id="text" maxlength="4000" placeholder="Type your message…"></textarea><div class="row"><button id="push">Push Now</button><button class="secondary" id="clear">Clear</button></div><div class="toast" id="toast"></div></div>
<div class="card"><label>Appearance</label><div class="row"><div><label>Font</label><select id="font"><option>Segoe UI</option><option>Arial</option><option>Consolas</option><option>Tahoma</option></select></div><div><label>Size</label><div class="range"><input id="size" type="range" min="8" max="120" value="16"><div class="pill" id="sizeV">16</div></div></div></div>
<div class="row"><div><label>Text Color</label><input id="color" type="color" value="#efefef"></div><div><label>Opacity</label><div class="range"><input id="opacity" type="range" min="5" max="100" value="100"><div class="pill" id="opacityV">100%</div></div></div></div>
<div class="row"><div><label>Width</label><input id="width" type="number" min="200" max="2400" value="700"></div><div><label>Height</label><input id="height" type="number" min="50" max="600" value="100"></div></div>
<div class="row"><div><label>X</label><input id="x" type="number" value="40"></div><div><label>Y</label><input id="y" type="number" value="40"></div></div>
<div class="checks"><label class="check"><input id="bold" type="checkbox" checked> Bold</label><label class="check"><input id="enabled" type="checkbox" checked> Overlay Enabled</label></div>
<div class="row"><button class="secondary" id="center">Center</button><button class="secondary" id="reset">Reset Style</button></div></div></div>
<div>
<div class="card"><label>Connection</label><div class="pill" id="count">Connected agents: 0</div><div class="row"><button id="reconnect" class="secondary">Reconnect</button><button id="ping" class="secondary">Ping</button></div><div class="footer" style="margin-top:10px">The agent must be connected to this same session token.</div></div>
<div class="card"><label>Quick Actions</label><div class="row"><button id="on">Enable</button><button id="off" class="danger">Disable</button></div><div class="row"><button id="clear2" class="secondary">Clear Overlay</button><button id="save" class="secondary">Save State</button></div></div>
<div class="card"><label>Session</label><div class="footer" id="tokenInfo">Token loaded from this page URL.</div></div>
</div></div></div>
<script>
const p=new URLSearchParams(location.search),token=p.get('token');let ws,retry=0,manual=false;const $=id=>document.getElementById(id);
const state={text:'',enabled:true,font_size:16,text_color:'#efefef',opacity:100,x:40,y:40,width:700,height:100,bold:true,font_family:'Segoe UI'};
function setStatus(ok,msg){$('status').textContent=msg|| (ok?'ONLINE':'OFFLINE');$('status').className='status '+(ok?'ok':'');}
function read(){return {...state,text:$('text').value,enabled:$('enabled').checked,font_size:+$('size').value,text_color:$('color').value,opacity:+$('opacity').value,x:+$('x').value,y:+$('y').value,width:+$('width').value,height:+$('height').value,bold:$('bold').checked,font_family:$('font').value};}
function apply(s){if(!s)return;Object.assign(state,s);$('text').value=s.text??'';$('enabled').checked=s.enabled!==false;$('size').value=s.font_size??16;$('sizeV').textContent=$('size').value;$('color').value=s.text_color||'#efefef';$('opacity').value=s.opacity??100;$('opacityV').textContent=$('opacity').value+'%';$('x').value=s.x??40;$('y').value=s.y??40;$('width').value=s.width??700;$('height').value=s.height??100;$('bold').checked=s.bold!==false;$('font').value=s.font_family||'Segoe UI';}
function send(){if(!ws||ws.readyState!==1){$('toast').textContent='Agent/control connection is offline';return false}ws.send(JSON.stringify({type:'state',state:read()}));$('toast').textContent='State sent';return true}
function connect(){if(!token){setStatus(false,'NO TOKEN');return}try{ws&&ws.close()}catch{} ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/control/'+encodeURIComponent(token));ws.onopen=()=>{retry=0;setStatus(true,'ONLINE');$('toast').textContent='Connected'};ws.onclose=()=>{setStatus(false,'RECONNECTING');if(!manual)setTimeout(connect,Math.min(5000,700*Math.max(1,++retry)))};ws.onerror=()=>setStatus(false,'ERROR');ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='hello'){ $('session').textContent='Session: '+m.session;apply(m.state)}if(m.type==='presence')$('count').textContent='Connected clients: '+m.count}catch{}}}
$('text').oninput=send;$('enabled').onchange=send;$('bold').onchange=send;$('font').onchange=send;$('size').oninput=e=>{$('sizeV').textContent=e.target.value;send()};$('opacity').oninput=e=>{$('opacityV').textContent=e.target.value+'%';send()};['color','x','y','width','height'].forEach(id=>$(id).oninput=send);$('push').onclick=send;$('clear').onclick=$('clear2').onclick=()=>{$('text').value='';send()};$('on').onclick=()=>{$('enabled').checked=true;send()};$('off').onclick=()=>{$('enabled').checked=false;send()};$('center').onclick=()=>{$('x').value=Math.max(0,Math.floor((screen.width-+$('width').value)/2));$('y').value=Math.max(0,Math.floor((screen.height-+$('height').value)/2));send()};$('reset').onclick=()=>{apply({font_size:16,text_color:'#efefef',opacity:100,x:40,y:40,width:700,height:100,bold:true,font_family:'Segoe UI'});send()};$('save').onclick=send;$('ping').onclick=()=>{if(ws?.readyState===1){ws.send(JSON.stringify({type:'ping'}));$('toast').textContent='Ping sent'}};$('reconnect').onclick=()=>{manual=false;retry=0;connect()};connect();
</script></body></html>
