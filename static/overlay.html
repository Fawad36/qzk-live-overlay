<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QZK Overlay</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}#o{position:fixed;left:40px;top:40px;max-width:90vw;white-space:pre-wrap;word-break:break-word;font-family:"Segoe UI",system-ui,sans-serif;font-size:16px;font-weight:600;color:#efefef;text-shadow:0 1px 3px #000;transition:opacity .08s linear;user-select:none}</style></head><body><div id="o"></div><script>
const token=new URLSearchParams(location.search).get('token'), o=document.getElementById('o');let ws;
function apply(s){if(!s)return;o.textContent=s.text||'';o.style.display=s.enabled===false?'none':'block';o.style.left=(s.x??40)+'px';o.style.top=(s.y??40)+'px';o.style.fontSize=(s.font_size??16)+'px';o.style.color=s.text_color||'#efefef';o.style.opacity=s.opacity??1}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/control/'+encodeURIComponent(token));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='hello'||m.type==='state')apply(m.state)};ws.onclose=()=>setTimeout(connect,1000)}connect();
</script></body></html>
